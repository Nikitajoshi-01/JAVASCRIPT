<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REALATIONS </title>
</head>
<body>
    <div class="parent">
        <div class="day">mon</div>
        <div class="day">tues</div>
        <div class="day">wed</div>
        <div class="day">thurs</div>
        <div class="day">fri</div>
        <div class="day">sat</div>
        <div class="day">sun</div>

    </div>
</body>
<script>
   const par= document.querySelector('.parent');
   console.log(par)
   console.log(par.children); // gives the html collection of all the children of the parent element
   console.log(par.children[0].innerHTML); // gives the html content of the first child of the parent element
   for(let i =0;i<par.children.length;i++){
    console.log(par.children[i].innerHTML); // gives the html content of all the children of the parent element
   }
   par.children[0].style.color="red";
   console.log("frist element =====" +par.firstElementChild.innerHTML);
   console.log("last eleent ===="+par.lastElementChild.innerHTML);
   console.log("NODES: " , par.childNodes); // gives the node list of all the children of the parent element including text nodes and comment nodes
</script>
</html>
