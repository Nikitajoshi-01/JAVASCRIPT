<script>
//task: to asdd one more list:
                            // here the tree is traversed everytime i add another language 

                            function addlang(langname){
                            const li= document.createElement('li');
                            li.innerHTML=`${langname}`;
                            document.querySelector('.languages').appendChild(li);
                            }
                            addlang('python');
                            
//////////////////////////////////////////
function addlangoptimised(langname){
    const li=document.createElement('li');
    li.appendChild(document.createTextNode(langname));
    document.querySelector('.languages').appendChild(li);
}
addlangoptimised('java');







// EDITING THE CONTENT OF THE ELEMENTS
const doc =document.querySelector('li:nth-child(2)');
const newele=doc.appendChild(document.createElement('li'));;
newele.textContent="c++";
doc.replaceWith(newele); // this will replace the second li with the new li which is created and added as a child of the second li


//edit 
const firstchild=document.querySelector("li:first-child")
firstchild.outerHTML="<li>c#</li>"; // this will replace the first li with the new li which is created and added as a child of the first li
